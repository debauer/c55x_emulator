[project]
name = "c55x-emu"
version = "0.1.0"
description = "Emulator for the TI TMS320C55x DSP of the Zen Touch player"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]

[project.scripts]
c55x-emu = "c55x_emu.__main__:main"
c55x-emu-gui = "c55x_emu.qt_ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c55x_emu"]
